name: Playwright Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test scope
        required: true
        default: smoke
        type: choice
        options: [smoke, all]

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run framework gates
        run: |
          npm run check:locator-strategy
          npm run check:ddt-fixtures
          npm run lint
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
      # Feeds M2 (first-pass CI rate). Only attempt 1 counts, so a re-run does not launder a
      # failure into a pass. Runs before evidence:build so M2 includes this run.
      #
      # NOTE: this writes to the throwaway checkout. The row reaches the uploaded artifact but
      # does NOT persist to the tracked evidence/ci-history.jsonl. For a durable M2, either add a
      # commit-back job on main, or backfill locally from the Actions API. See docs/START-HERE.md.
      - name: Record CI outcome for M2
        if: always() && job.status != 'cancelled'
        run: >
          node scripts/record-evidence.mjs ci
          --pipeline "${{ github.run_id }}"
          --trigger "${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && 'push' || 'manual') }}"
          --attempt "${{ github.run_attempt }}"
          --outcome "${{ job.status == 'success' && 'passed' || 'failed' }}"
      - name: Build machine evidence
        if: always()
        run: npm run evidence:build
      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright/evidence/tests/
            evidence/

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: smoke
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.test_scope == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
      - name: Build machine evidence
        if: always()
        run: npm run evidence:build
      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright/evidence/tests/
            evidence/
