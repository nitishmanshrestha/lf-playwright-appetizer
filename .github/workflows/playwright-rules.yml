name: Playwright Architecture Rules

# ─────────────────────────────────────────────────────────────────────────────
# Runs the non-negotiable architecture validation hook on every PR that touches
# Playwright code, hooks, or framework config.
#
# This is the CI equivalent of the local Edit/Write hook. Both use the same
# scanner; CI covers changes made outside an AI tool and scans the full tree.
#
# Blocks merge if:
#   - page.waitForTimeout(number) is found
#   - a spec imports test/expect from @playwright/test instead of base.fixture
#   - hardcoded selectors are found in specs or helpers
#   - hardcoded routes are found in specs or helpers
#   - page-object wrapper imports are added
#   - a credential is assigned a literal string
#   - a smoke spec issues a write request
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - "playwright/**"
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - ".claude/agents/**"
      - ".github/agents/**"
      - ".github/hooks/**"
      - ".github/copilot-instructions.md"
      - "harness/**"
      - "harness.config.json"
      - "package.json"
      - "scripts/engine/**"
      - "CLAUDE.md"
      - "README.md"

jobs:
  validate-architecture:
    name: Architecture Rules Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify harness projections
        run: npm run harness:check && npm run harness:test

      - name: Validate non-negotiable rules
        run: npm run check:rules
